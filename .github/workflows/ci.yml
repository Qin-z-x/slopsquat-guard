name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Core must be standard-library only
        run: python scripts/check_core_deps.py

      - name: Unit tests (unittest, mocked registry, no network)
        run: python -m unittest discover -s tests -t .

      - name: Install pytest (dev-only)
        run: python -m pip install --disable-pip-version-check pytest

      - name: Unit tests via pytest
        run: python -m pytest

      - name: Bundled popularity lists are complete and unique
        run: |
          python -c "
          from slopsquat_guard.popular import PopularLists
          lists = PopularLists()
          for ecosystem in ('pypi', 'npm'):
              names = lists.names[ecosystem]
              assert len(names) == 1000, (ecosystem, len(names))
              assert len(set(names)) == 1000, ecosystem
          print('popularity lists OK: 1000 unique names per ecosystem')
          "

      - name: Offline scan of the synthetic LLM manifest (JSON)
        run: |
          python -m slopsquat_guard scan --path examples/llm_manifest --offline --cache examples/registry_cache.json --json > scan.json
          python -c "
          import json
          result = json.load(open('scan.json', encoding='utf-8'))
          assert result['offline'] is True
          assert result['summary']['high'] >= 8, result['summary']
          assert result['summary']['typosquat_suspects'] >= 3, result['summary']
          assert result['summary']['not_found'] >= 8, result['summary']
          print('offline scan summary:', result['summary'])
          "

      - name: CI gate catches hallucinated/typosquatted names (expected exit code 1)
        run: |
          set +e
          python -m slopsquat_guard scan --path examples/llm_manifest --offline --cache examples/registry_cache.json --fail-on high
          code=$?
          set -e
          echo "scan exit code: $code"
          test "$code" -eq 1

      - name: CI gate passes the real-package control manifest (expected exit code 0)
        run: python -m slopsquat_guard scan --path examples/clean_manifest --offline --cache examples/registry_cache.json --fail-on high

      - name: Verify a typosquat name (offline, expected exit code 1)
        run: |
          set +e
          python -m slopsquat_guard verify reqeusts --offline --cache examples/registry_cache.json --fail-on high
          code=$?
          set -e
          echo "verify exit code: $code"
          test "$code" -eq 1

      - name: Verify a real name (offline, expected exit code 0)
        run: python -m slopsquat_guard verify requests --offline --cache examples/registry_cache.json --fail-on high

      - name: JSON Schemas validate emitted results
        run: python -m unittest tests.test_schema -v
