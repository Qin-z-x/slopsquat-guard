[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopsquat-guard"
version = "0.1.0"
description = "Find hallucinated and typosquatted dependencies before installing them: verify PyPI/npm names, flag near-misses of popular packages, offline cache support."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "slopsquat-guard contributors" }]
keywords = [
  "supply-chain",
  "slopsquatting",
  "package-hallucination",
  "typosquat",
  "llm",
  "security",
  "pypi",
  "npm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slopsquat-guard = "slopsquat_guard.cli:main"

[project.urls]
Homepage = "https://github.com/Qin-Z-x/slopsquat-guard"
Repository = "https://github.com/Qin-Z-x/slopsquat-guard"
Issues = "https://github.com/Qin-Z-x/slopsquat-guard/issues"
Changelog = "https://github.com/Qin-Z-x/slopsquat-guard/blob/main/CHANGELOG.md"
Evidence = "https://github.com/Qin-Z-x/slopsquat-guard/blob/main/docs/EVIDENCE.md"
ThreatModel = "https://github.com/Qin-Z-x/slopsquat-guard/blob/main/docs/THREAT_MODEL.md"
DataSources = "https://github.com/Qin-Z-x/slopsquat-guard/blob/main/docs/DATA_SOURCES.md"

[tool.setuptools]
packages = ["slopsquat_guard"]

[tool.setuptools.package-data]
slopsquat_guard = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
